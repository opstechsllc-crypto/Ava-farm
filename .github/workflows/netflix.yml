name: Build, Analyze, Scan

on:
  push:
    branches:
      - main

jobs:
  build-analyze-scan:
    name: Build, Analyze and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # SonarQube
      # -------------------------
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -------------------------
      # Install Trivy
      # -------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # -------------------------
      # Trivy filesystem scan
      # -------------------------
      - name: Trivy Filesystem Scan
        run: |
          trivy fs --severity HIGH,CRITICAL .

      # -------------------------
      # Verify Dockerfile
      # -------------------------
      - name: Verify Dockerfile
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Dockerfiles found:"
          find . -maxdepth 3 -type f -iname 'Dockerfile*' -print

      # -------------------------
      # Docker Build
      # -------------------------
      - name: Docker Build
        run: |
          docker build \
            --build-arg TMDB_V3_API_KEY="${{ secrets.TMDB_V3_API_KEY }}" \
            -t netflix .

      # -------------------------
      # Docker Login
      # -------------------------
      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # -------------------------
      # Docker Tag
      # -------------------------
      - name: Docker Tag
        run: |
          docker tag netflix opstechllc/netflix:latest

      # -------------------------
      # Docker Push
      # -------------------------
      - name: Docker Push
        run: |
          docker push opstechllc/netflix:latest

  deploy:
    needs: build-analyze-scan
    runs-on: [sonerqube]
    steps:
      - name: Pull the docker image
        run: docker pull opstechllc/netflix:latest
      - name: Trivy image scan
        run: trivy image opstechllc/netflix:latest
      - name: Run the container netflix
        run: docker run -d --name netflix -p 8081:80 opstechllc/netflix:latest
